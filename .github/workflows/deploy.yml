name: Deploy

# Publishes the static app to Cloudflare Pages on every push to main.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID,
# and optionally a repository variable PAGES_DOMAIN (see docs/HOSTING.md).
# Without the secrets the job is skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  PROJECT: ${{ vars.PAGES_PROJECT || 'lightkone' }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for Cloudflare secrets
        id: keys
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping deploy."
          fi
      - if: steps.keys.outputs.ok
        uses: actions/checkout@v4
      - if: steps.keys.outputs.ok
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.keys.outputs.ok
        run: npm ci && npm run check && npm run build
      - name: Create the Pages project on first deploy
        if: steps.keys.outputs.ok
        run: npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main || true
      - name: Publish
        if: steps.keys.outputs.ok
        run: npx --yes wrangler@4 pages deploy dist --project-name "$PROJECT" --branch main
      - name: Attach custom domain
        if: steps.keys.outputs.ok && vars.PAGES_DOMAIN
        run: |
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            --data "{\"name\":\"${{ vars.PAGES_DOMAIN }}\"}" | jq -c '{success, errors}'

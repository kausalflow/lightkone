[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "lightkone"
dynamic = ["version"]
description = "Lightkone from the command line and from Python: your papers, tags, folders, notes, BibTeX and citation map, in the same files as the web app."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "KausalFlow" }]
keywords = ["references", "bibtex", "papers", "citations", "research", "lightkone"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "typer>=0.12",
    "click>=8.1.7",
    "requests>=2.26",
]

[project.optional-dependencies]
data = ["pandas>=2.0"]
graph = ["networkx>=3.0"]
crypto = ["cryptography>=41"]
all = ["pandas>=2.0", "networkx>=3.0", "cryptography>=41"]
dev = ["pytest>=8", "pandas>=2.0", "networkx>=3.0", "cryptography>=41"]

[project.urls]
Homepage = "https://lightkone.lab.kausalflow.com"
Documentation = "https://lightkone.lab.kausalflow.com/docs/cli.html"

[project.scripts]
lightkone = "lightkone.cli:run"

[tool.hatch.version]
path = "lightkone/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["lightkone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
